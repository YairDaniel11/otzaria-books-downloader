name: Release

# פרסום דרך ה-Action הרשמי של אוצריא: אימות, בנייה, ופרסום לחנות.
# הטריגר נשאר תג — התג הוא מקור האמת לגרסה, והמניפסט מסונכרן אליו.
#
# מדוע לא תהליך משלנו: התהליך הקודם התחבר לחנות בעצמו מול
# /api/auth/callback/credentials, ואחרי שינוי בצד השרת ההתחברות הזו החלה
# להידחות. ה-Action הרשמי מתוחזק יחד עם החנות ולכן עוקב אחרי החוזה.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'תג לפרסום (למשל v3.1.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and sync the manifest
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "התג חייב להיראות vX.Y.Z (התקבל '$tag')"; exit 1 ;;
          esac
          node -e "
            const fs=require('fs'), p='src/manifest.json';
            const m=JSON.parse(fs.readFileSync(p,'utf8').replace(/^\uFEFF/,''));
            m.version=process.argv[1];
            fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');
          " "$version"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate, build and publish to the store
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: src
          build: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Create GitHub Release
        if: steps.otzaria.outputs.plugin-file != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.otzaria.outputs.plugin-file }}
          body: |
            ## הורדת ספרים — ${{ steps.v.outputs.tag }}

            ### התקנה
            מי שהתקין מהחנות מקבל את העדכון אוטומטית. להתקנה ידנית הורידו את
            קובץ ה-`.otzplugin` שלמטה, ובאוצריא: **הגדרות → ניהול תוספים → התקנה מקובץ**.

            ### Checksum
            ```
            SHA-256: ${{ steps.otzaria.outputs.sha256 }}
            ```

      - name: Summary
        run: |
          echo "גרסה: ${{ steps.v.outputs.version }}"
          echo "אימות עבר: ${{ steps.otzaria.outputs.passed }}"
          echo "פורסם לחנות: ${{ steps.otzaria.outputs.published }}"
